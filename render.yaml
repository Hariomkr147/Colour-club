services:
  - type: web
    name: colour-club
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: REQUIRE_VERIFICATION
        value: "false"
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
